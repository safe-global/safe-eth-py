services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready"]
      timeout: 5s
      retries: 3

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    ports:
      - "8545:8545"
    command: >-
      "anvil --host 0.0.0.0 --chain-id 1337 --accounts 10 --balance 10000
      --gas-limit 200000000
      --mnemonic 'myth like bonus scare over problem client lizard pioneer submit female collect'"
    healthcheck:
      test: ["CMD", "cast", "block-number"]
      interval: 1s
      retries: 10
