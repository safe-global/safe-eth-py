version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      eth:
        patterns:
          - "web3"
          - "eth-*"
          - "py-evm*"
          - "safe-pysha3*"
        update-types:
          - minor
          - patch
      django:
        patterns:
          - "django*"
          - "djangorestframework*"
          - "drf*"
          - "psycopg*"
        update-types:
          - minor
          - patch
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # The init and analyze actions must run the same version, so they are always
      # updated together, majors included
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
